name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a superseded run when new commits land on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + self-tests (Windows / MSYS2 MinGW + Qt6)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-svg

      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/mingw64

      - name: Build
        shell: msys2 {0}
        run: cmake --build build

      - name: Offline self-tests (no network)
        shell: msys2 {0}
        run: |
          ./build/Phoenix.exe --self-test-proto
          ./build/Phoenix.exe --self-test-urlmatch
          ./build/Phoenix.exe --self-test-settings
          ./build/Phoenix.exe --self-test-native

      - name: Network self-tests
        shell: msys2 {0}
        run: |
          ./build/Phoenix.exe --self-test
          ./build/Phoenix.exe --self-test-listen
          ./build/Phoenix.exe --self-test-schedule
          ./build/Phoenix.exe --self-test-sleep
          ./build/Phoenix.exe --self-test-limit
          ./build/Phoenix.exe --self-test-retry
          ./build/Phoenix.exe --self-test-mt
          ./build/Phoenix.exe --self-test-resume
          ./build/Phoenix.exe --self-test-queue